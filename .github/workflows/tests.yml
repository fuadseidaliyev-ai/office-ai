name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        # The guard/tool-wiring tests import the assistant lazily, so they only
        # need the Agent SDK and pytest — not the audio stack (sounddevice,
        # faster-whisper, pyttsx3), which requires system libraries.
        run: |
          python -m pip install --upgrade pip
          pip install claude-agent-sdk pytest

      - name: Run tests
        run: pytest -q
