<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>ApocGo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #0b0806;
      overflow: hidden;
      touch-action: none;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      display: block;
    }
    #rotate {
      display: none;
      position: fixed;
      inset: 0;
      align-items: center;
      justify-content: center;
      padding: 0 24px;
      text-align: center;
      background: rgba(11, 8, 6, 0.92);
      color: #e0b25a;
      font: 18px 'Exo 2', 'Segoe UI', Roboto, sans-serif;
    }
    @media (orientation: portrait) and (pointer: coarse) {
      #rotate { display: flex; }
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #e0b25a;
      font: 20px 'Exo 2', sans-serif;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="loading">Загрузка…</div>
  <div id="rotate">Поверните телефон горизонтально ↻</div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
